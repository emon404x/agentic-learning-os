<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#00f5ff" flood-opacity="0.22" />
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Core Shimmer Gradients -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #ec4899; #06b6d4; #a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #3b82f6; #a855f7; #06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="beam-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="beam-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cube-top-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cube-left-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="cube-right-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#032b44" />
    </linearGradient>

    <linearGradient id="cube-top-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cube-left-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="cube-right-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>

    <linearGradient id="grid-fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00f5ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Glassmorphic Card Background -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    @keyframes float-slow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float-fast {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float-reverse {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(16px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-ring {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 12px; opacity: 0.3; }
      100% { r: 6px; opacity: 0.9; }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbit-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes glow-pulse {
      0% { opacity: 0.45; }
      50% { opacity: 0.85; }
      100% { opacity: 0.45; }
    }

    .anim-float-1 { animation: float-slow 6s ease-in-out infinite; }
    .anim-float-2 { animation: float-fast 5s ease-in-out infinite; }
    .anim-float-3 { animation: float-reverse 7s ease-in-out infinite; }
    .anim-pulse { animation: glow-pulse 4s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8 6; animation: dash-flow 12s linear infinite; }
    .orbiting { transform-origin: 990px 220px; animation: orbit-rotate 24s linear infinite; }

    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 12.5px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bg-grad)" />

  <!-- Outer Neon Frame -->
  <rect width="1198" height="458" x="1" y="1" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow-cyan)" class="anim-pulse" />
  <circle cx="1020" cy="240" r="180" fill="#a855f7" opacity="0.15" filter="url(#glow-purple)" class="anim-pulse" />
  <circle cx="600" cy="400" r="160" fill="#06b6d4" opacity="0.08" filter="url(#glow-cyan)" />

  <!-- 3D Isometric Perspective Floor Grid -->
  <g opacity="0.45" stroke="url(#grid-fade)" stroke-width="1.2">
    <!-- Perspective Converging Lines -->
    <path d="M600 240 L-100 480" />
    <path d="M600 240 L100 480" />
    <path d="M600 240 L300 480" />
    <path d="M600 240 L500 480" />
    <path d="M600 240 L700 480" />
    <path d="M600 240 L900 480" />
    <path d="M600 240 L1100 480" />
    <path d="M600 240 L1300 480" />

    <!-- Isometric Horizon Latitudes -->
    <path d="M260 300 L940 300" />
    <path d="M180 340 L1020 340" />
    <path d="M90 390 L1110 390" />
    <path d="M-20 450 L1220 450" />
  </g>

  <!-- Glowing Neural Circuit Traces -->
  <g fill="none" stroke-width="1.5" opacity="0.6">
    <path d="M120 80 L280 80 L340 140 L460 140" stroke="#38bdf8" class="anim-dash" />
    <path d="M850 110 L940 110 L990 160 L1100 160" stroke="#c084fc" class="anim-dash" />
    <path d="M780 380 L880 380 L940 320 L1060 320" stroke="#00f5ff" class="anim-dash" />
    <path d="M80 360 L180 360 L240 300 L320 300" stroke="#818cf8" class="anim-dash" />
  </g>

  <!-- Circuit Junction Nodes -->
  <circle cx="280" cy="80" r="3.5" fill="#00f5ff" />
  <circle cx="340" cy="140" r="3.5" fill="#38bdf8" />
  <circle cx="940" cy="110" r="3.5" fill="#c084fc" />
  <circle cx="990" cy="160" r="3.5" fill="#e879f9" />
  <circle cx="940" cy="320" r="3.5" fill="#00f5ff" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 0)">
    <!-- Version & Framework Pill -->
    <g transform="translate(0, 72)">
      <rect width="320" height="30" rx="15" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" fill="#94a3b8" class="badge-text">AGENTIC LEARNING OS <tspan fill="#38bdf8">v3.0.0</tspan> • PRODUCTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" font-size="52" fill="url(#title-gradient)" class="brand-title" filter="url(#glow-cyan)">AGENTIC LEARNING OS</text>

    <!-- Subtitle / Tagline -->
    <g transform="translate(2, 196)">
      <text x="0" y="0" font-size="14.5" fill="#e2e8f0" class="brand-sub">
        LEARN ANYTHING <tspan fill="#38bdf8">•</tspan> BUILD EVERYTHING <tspan fill="#a855f7">•</tspan> MASTER MORE
      </text>
    </g>

    <!-- Feature Description -->
    <text x="2" y="234" font-size="14.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" line-height="1.5">
      Autonomous multi-agent learning engine for Google Antigravity &amp; CLI.
    </text>
    <text x="2" y="256" font-size="14.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      10 Specialized AI Agents <tspan fill="#38bdf8">•</tspan> 21 Validated Tools <tspan fill="#a855f7">•</tspan> Relational SQLite Memory
    </text>

    <!-- Feature Stat Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: 10 Agents -->
      <g transform="translate(0, 0)">
        <rect width="130" height="54" rx="10" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="14" y="24" fill="#38bdf8" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900">10 Agents</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Autonomous DAG</text>
      </g>

      <!-- Badge 2: 21 Tools -->
      <g transform="translate(142, 0)">
        <rect width="130" height="54" rx="10" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="14" y="24" fill="#a855f7" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900">21 Tools</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">5 Autonomy Tiers</text>
      </g>

      <!-- Badge 3: 15 Skills -->
      <g transform="translate(284, 0)">
        <rect width="130" height="54" rx="10" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="14" y="24" fill="#10b981" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900">15 Skills</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Antigravity Native</text>
      </g>

      <!-- Badge 4: 81 Tests -->
      <g transform="translate(426, 0)">
        <rect width="130" height="54" rx="10" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="14" y="24" fill="#f59e0b" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900">81 Tests</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">100% Verified Pass</text>
      </g>
    </g>

    <!-- Maintainer Attribution Tag -->
    <g transform="translate(0, 386)">
      <text x="2" y="16" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        DEVELOPED &amp; MAINTAINED BY <tspan fill="#e2e8f0" font-weight="700">MD. AKTARUZZAMAN EMON</tspan> (<tspan fill="#38bdf8">@emon404x</tspan>)
      </text>
    </g>
  </g>

  <!-- RIGHT 3D ISOMETRIC DISPLAY -->
  <g transform="translate(710, 30)">
    <!-- Orbiting Ring in 3D tilt -->
    <g class="orbiting" opacity="0.35">
      <ellipse cx="280" cy="190" rx="170" ry="85" fill="none" stroke="url(#beam-cyan)" stroke-width="1.8" stroke-dasharray="12 8" transform="rotate(-20 280 190)" />
      <circle cx="120" cy="160" r="5" fill="#00f5ff" filter="url(#glow-cyan)" />
      <circle cx="440" cy="220" r="6" fill="#a855f7" filter="url(#glow-purple)" />
    </g>

    <!-- Floating 3D Isometric Card 1: Central Orchestrator -->
    <g class="anim-float-1" transform="translate(140, 60)" filter="url(#shadow-3d)">
      <polygon points="120,10 240,70 120,130 0,70" fill="url(#cube-top-1)" opacity="0.9" />
      <polygon points="0,70 120,130 120,170 0,110" fill="url(#cube-left-1)" />
      <polygon points="120,130 240,70 240,110 120,170" fill="url(#cube-right-1)" />
      <!-- Central Core Light -->
      <circle cx="120" cy="70" r="16" fill="#ffffff" opacity="0.9" filter="url(#glow-cyan)">
        <animate attributeName="r" values="14;18;14" dur="3s" repeatCount="indefinite" />
      </circle>
      <!-- Label Banner -->
      <g transform="translate(42, 60)">
        <rect width="156" height="26" rx="6" fill="#050b1a" opacity="0.92" stroke="#38bdf8" stroke-width="1" />
        <text x="78" y="17" fill="#e0f2fe" text-anchor="middle" class="card-label">10-Stage Orchestrator</text>
      </g>
    </g>

    <!-- Floating 3D Isometric Card 2: Knowledge DAG & Tutor -->
    <g class="anim-float-2" transform="translate(20, 190)" filter="url(#card-shadow)">
      <polygon points="90,10 180,55 90,100 0,55" fill="url(#cube-top-2)" opacity="0.85" />
      <polygon points="0,55 90,100 90,130 0,85" fill="url(#cube-left-2)" />
      <polygon points="90,100 180,55 180,85 90,130" fill="url(#cube-right-2)" />
      <circle cx="90" cy="55" r="12" fill="#f0abfc" opacity="0.9" filter="url(#glow-purple)" />
      <g transform="translate(18, 45)">
        <rect width="144" height="24" rx="6" fill="#160826" opacity="0.92" stroke="#c084fc" stroke-width="1" />
        <text x="72" y="16" fill="#fae8ff" text-anchor="middle" class="card-label">Prerequisite DAG</text>
      </g>
    </g>

    <!-- Floating 3D Isometric Card 3: Practical Lab & Security -->
    <g class="anim-float-3" transform="translate(240, 230)" filter="url(#card-shadow)">
      <polygon points="100,10 200,60 100,110 0,60" fill="#059669" opacity="0.85" />
      <polygon points="0,60 100,110 100,140 0,90" fill="#047857" />
      <polygon points="100,110 200,60 200,90 100,140" fill="#065f46" />
      <circle cx="100" cy="60" r="12" fill="#34d399" opacity="0.9" filter="url(#glow-cyan)" />
      <g transform="translate(24, 50)">
        <rect width="152" height="24" rx="6" fill="#022116" opacity="0.92" stroke="#10b981" stroke-width="1" />
        <text x="76" y="16" fill="#ecfdf5" text-anchor="middle" class="card-label">AST-Isolated Labs</text>
      </g>
    </g>

    <!-- Floating Mini Isometric Crystal/Cube in Background -->
    <g class="anim-float-2" transform="translate(320, 90)">
      <polygon points="30,0 60,15 30,30 0,15" fill="#f59e0b" opacity="0.9" />
      <polygon points="0,15 30,30 30,45 0,30" fill="#d97706" />
      <polygon points="30,30 60,15 60,30 30,45" fill="#b45309" />
    </g>

    <g class="anim-float-1" transform="translate(50, 110)">
      <polygon points="25,0 50,12 25,24 0,12" fill="#38bdf8" opacity="0.8" />
      <polygon points="0,12 25,24 25,34 0,22" fill="#0284c7" />
      <polygon points="25,24 50,12 50,22 25,34" fill="#0369a1" />
    </g>

    <!-- 3D Interconnecting Light Beams -->
    <path d="M260 130 L110 245" stroke="url(#beam-cyan)" stroke-width="2" class="anim-dash" />
    <path d="M260 130 L340 290" stroke="url(#beam-purple)" stroke-width="2" class="anim-dash" />
    <path d="M110 245 L340 290" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4" />
  </g>
</svg>
