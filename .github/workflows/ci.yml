name: Agentic Learning OS CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run full unit, agentic architecture, and audit test suite (81 tests)
        run: |
          python -m unittest discover -s tests -v

      - name: Run CLI & end-to-end walkthrough verification
        run: |
          python examples/demo_walkthrough.py
          python scripts/alos.py agents
          python scripts/alos.py tools
          python scripts/alos.py orchestrate "Teach me computer networking from beginner to advanced."
          python scripts/alos.py tutor "I don't understand subnetting."
          python scripts/alos.py lab "Teach me DSA using C" --language c --hint 1
